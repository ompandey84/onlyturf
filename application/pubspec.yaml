name: application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  google_fonts: ^8.0.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  geocoding: ^4.0.0
  geolocator: ^13.0.1
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.5.4
  provider: ^6.1.1
  lottie: ^3.3.2
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - logo/
    - assets/
    - assets/animations/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/launcher/icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/icon_foreground_transparent.png"
  min_sdk_android: 21
